name: Propor controle novo
description: Sugerir um controle para o catálogo
title: "[controle] "
labels: ["controle"]
body:
  - type: markdown
    attributes:
      value: |
        A regra do catálogo é dura de propósito: **se o controle não pode ser verificado
        automaticamente, ele não entra.** Um controle "avaliado por inspeção"
        transformaria este projeto no documento de aderência que ele existe para
        substituir.

  - type: textarea
    id: gap
    attributes:
      label: Que gap real este controle pega
      description: O modo de falha concreto, não a boa prática abstrata.
      placeholder: |
        Alerta que pagina alguém às 3h aponta para um runbook que foi apagado numa
        refatoração. O alerta continua disparando, e quem atende não tem o que seguir.
    validations:
      required: true

  - type: dropdown
    id: practice
    attributes:
      label: Prática ITIL
      options:
        - monitoring-and-event-management
        - service-level-management
        - incident-management
        - problem-management
        - change-enablement
        - continual-improvement
        - service-continuity
        - outra (explicar abaixo)
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severidade proposta
      description: >
        MUST tem poder de travar a prática no nível 1 pela regra de teto. Marcar como MUST
        algo que é boa prática mas não é essencial faz o score reprovar quem não merece.
      options:
        - MUST (essencial, trava a prática se reprovar)
        - SHOULD (recomendado)
        - MAY (maturidade avançada)
    validations:
      required: true

  - type: textarea
    id: probe
    attributes:
      label: Como verificar automaticamente
      description: >
        Que campo do inventário declarado responde a pergunta, ou que query contra um
        backend. Se a resposta for "olhando", o controle não entra.
      validations:
        required: true

  - type: textarea
    id: cobit
    attributes:
      label: Objetivo COBIT (opcional)
      description: Identificador, se souber. Ex.: DSS02, APO09.
