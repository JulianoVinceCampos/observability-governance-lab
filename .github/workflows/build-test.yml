name: build-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 é o piso declarado e 3.13 a release atual. Testar só a versão da máquina de
        # quem mantém é como um pacote quebra para todo mundo mais.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instala (o pacote não tem dependência de runtime)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Testes
        run: python -m pytest

      - name: Gate nos dois fixtures, pelo exit code
        # O contrato da CLI é o exit code. bad-state tem que reprovar e good-state tem que
        # passar. Se os dois passarem, o gate parou de gatear e os testes podem estar
        # verdes por acidente.
        run: |
          set +e
          python -m obsgov.cli validate data/bad-state > /dev/null 2>&1
          bad=$?
          python -m obsgov.cli validate data/good-state > /dev/null 2>&1
          good=$?
          set -e
          echo "bad-state exit=$bad (esperado 1), good-state exit=$good (esperado 0)"
          test "$bad" -eq 1 || { echo "bad-state deveria reprovar"; exit 1; }
          test "$good" -eq 0 || { echo "good-state deveria passar"; exit 1; }

      - name: Regressão do número que o README afirma
        # Protege contra um refactor que deixa os testes verdes enquanto a ferramenta para
        # de medir o que o README promete.
        run: |
          python -m obsgov.cli report data/bad-state --out out/bad > /dev/null
          python -m obsgov.cli report data/good-state --out out/good > /dev/null
          python - <<'PY'
          import json, pathlib, sys
          bad = json.loads(pathlib.Path("out/bad/report.json").read_text())
          good = json.loads(pathlib.Path("out/good/report.json").read_text())
          b, g = bad["overall_maturity"], good["overall_maturity"]
          if len(bad["controls"]) != 30:
              sys.exit(f"regressao: {len(bad['controls'])} controles, esperado 30")
          if not g > b:
              sys.exit(f"regressao: good-state {g} nao superou bad-state {b}")
          capped = [p for p in bad["practices"] if p["ceiling_control"]]
          if not capped:
              sys.exit("regressao: nenhuma pratica travada em bad-state, a regra de teto nao atuou")
          print(f"30 controles, maturidade {b} -> {g}, {len(capped)} pratica(s) travada(s)")
          PY

      - name: O dashboard sobe e responde
        # Pega erro de empacotamento, como o bundle web ausente do wheel, que teste em
        # processo não vê.
        run: |
          python -m obsgov.cli serve data --host 127.0.0.1 --port 8765 &
          pid=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8765/api/health | grep -q '"status": "ok"'
          curl -fsS http://127.0.0.1:8765/ | grep -q '<!DOCTYPE html>'
          curl -fsS http://127.0.0.1:8765/app.js > /dev/null
          curl -fsS http://127.0.0.1:8765/styles.css > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/state/bad-state/scorecard)
          test "$code" = "401" || { echo "endpoint protegido devolveu $code, esperado 401"; kill $pid; exit 1; }
          kill $pid
          echo "dashboard OK: health, bundle servido, protecao de sessao ativa"
