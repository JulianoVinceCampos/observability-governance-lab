name: codeql

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript cobre o bundle web. Servir JS sem analisá-lo seria deixar
        # de fora justamente a parte que roda no navegador de quem visita o demo.
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3
        with:
          category: "/language:${{ matrix.language }}"
        # Sem continue-on-error, diferente do que é comum em repo com legado. Repo novo
        # pode tratar CodeQL como bloqueante desde o primeiro commit, e é o momento mais
        # barato de fazer isso.
