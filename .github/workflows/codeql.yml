name: codeql

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript cobre o bundle web. Servir JS sem analisá-lo seria deixar
        # de fora justamente a parte que roda no navegador de quem visita o demo.
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          category: "/language:${{ matrix.language }}"
        # Sem continue-on-error, diferente do que é comum em repo com legado. Repo novo
        # pode tratar CodeQL como bloqueante desde o primeiro commit, e é o momento mais
        # barato de fazer isso.
