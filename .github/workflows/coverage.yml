name: coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Testes com cobertura
        run: python -m pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Ratchet
        # Limiar fixo apodrece: as pessoas aprendem a viver logo acima dele. O piso só
        # sobe, o que transforma cobertura em porta de mão única.
        run: python3 tools/coverage_ratchet.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
