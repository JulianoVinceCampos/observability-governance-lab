name: coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Testes com cobertura
        run: python -m pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Ratchet
        # Limiar fixo apodrece: as pessoas aprendem a viver logo acima dele. O piso só
        # sobe, o que transforma cobertura em porta de mão única.
        run: python3 tools/coverage_ratchet.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7
