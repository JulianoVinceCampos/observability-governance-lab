name: lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install ruff==0.8.4
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format (só verifica)
        run: ruff format --check .

  workflows:
    # Um pipeline que linta o código mas não a si mesmo está a um typo de pular um gate
    # em silêncio.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          fail-on-error: true

  docs:
    # docs/controls.md é gerado do catálogo. Este job garante que o commit não deixou o
    # doc divergir do código, que é exatamente o tipo de coisa que este projeto existe
    # para pegar em outro lugar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenera e compara
        run: |
          PYTHONPATH=src python3 tools/gen_controls_doc.py
          git diff --exit-code docs/controls.md \
            || { echo "docs/controls.md divergiu do catálogo. Rode tools/gen_controls_doc.py"; exit 1; }
