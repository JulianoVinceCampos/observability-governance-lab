# Release por tag. O artefato sai com SBOM e atestação de proveniência anexados, então
# quem baixa consegue verificar qual commit e qual workflow o produziu.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev]"

      - name: A suíte tem que passar na tag
        # Publicar release de um commit não testado é como um artefato quebrado chega ao
        # mundo com número de versão.
        run: |
          python3 tools/sanitize_scan.py
          python -m pytest -q

      - name: A tag confere com a versão do pacote
        # Tag v0.2.0 apontando para um pyproject em 0.1.0 é confusão garantida depois.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg" || { echo "tag e versão do pyproject divergem"; exit 1; }

      - name: Build
        run: python -m build

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: observability-governance-lab-sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json

      - name: Atestação de proveniência
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publica a release com os artefatos
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.cyclonedx.json
          body: |
            Verifique a proveniência dos artefatos:

            ```bash
            gh attestation verify <arquivo> --repo ${{ github.repository }}
            ```
