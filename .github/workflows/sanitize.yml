# Camada 2 do pipeline, e a única irreversível. Duas engines independentes checam a mesma
# intenção, então um bug em qualquer uma não desliga o gate em silêncio.
name: sanitize

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Histórico completo: vazamento em commit antigo continua sendo vazamento.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Scan de contexto corporativo (stdlib, zero dependência)
        run: python3 tools/sanitize_scan.py

      - name: Regras Semgrep de vazamento (segunda engine, mesma intenção)
        # Semgrep via pip em vez da action semgrep/semgrep-action: a action pina uma
        # versão sem suporte e espera token de app. Uma action de terceiro a menos para
        # manter pinada, mesmas regras, mesmo exit code.
        run: |
          python -m pip install --upgrade pip semgrep
          semgrep scan --config .semgrep/no-corp-leak.yml --error --quiet

      - name: Secret scan em todo o histórico
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
