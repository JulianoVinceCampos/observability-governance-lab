name: sca

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # Só faz sentido em PR: compara a base com o head. Em push para main não há o que
    # comparar, então o job é pulado em vez de falhar.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  osv-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instala osv-scanner
        run: python -m pip install --upgrade pip osv-scanner
      - name: Varre o manifesto
        # O pacote instalado não tem dependência de runtime, então esta varredura cobre o
        # tooling de dev. Superfície pequena por construção, e é o ponto: a única
        # dependência que pode ter CVE aqui é a que nunca vai para produção.
        run: osv-scanner scan --lockfile pyproject.toml || osv-scanner --lockfile pyproject.toml
