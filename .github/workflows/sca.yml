name: sca

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    # Só faz sentido em PR: compara a base com o head. Em push para main não há o que
    # comparar, então o job é pulado em vez de falhar.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # O grafo de dependência de um repo recém-criado pode ainda não ter sido
          # indexado, e a action falha por ausência de dado em vez de por
          # vulnerabilidade. Enquanto isso, o veredito de SCA que bloqueia é o pip-audit
          # abaixo, que não depende de serviço nenhum.
        continue-on-error: true

  pip-audit:
    # Substituiu o osv-scanner, que é binário em Go e não instala por pip. pip-audit é
    # Python, roda no mesmo ambiente que o pacote usa, e não depende de lockfile: ele
    # audita o que de fato está instalado.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instala o auditor
        run: python -m pip install --upgrade pip pip-audit

      - name: Resolve as dependências de dev num requirements
        # Auditar o ambiente inteiro com o pacote instalado em modo editável faz o
        # pip-audit reprovar por "não encontrado no PyPI", que é verdade e é irrelevante:
        # este pacote nunca foi publicado. Então o alvo da auditoria é a lista de
        # dependências, não o projeto local.
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          proj = data["project"]
          deps = list(proj.get("dependencies", []))
          deps += proj.get("optional-dependencies", {}).get("dev", [])
          pathlib.Path("requirements-audit.txt").write_text("\n".join(deps) + "\n")
          print(f"{len(deps)} dependencia(s) a auditar:")
          for d in deps:
              print(f"  {d}")
          PY

      - name: Audita as dependências
        # O pacote instalado não tem dependência de runtime, então o que esta varredura
        # cobre é o tooling de dev. Superfície pequena por construção, e é o ponto: a
        # única dependência que pode ter CVE aqui é a que nunca vai para produção.
        run: pip-audit --strict --progress-spinner off -r requirements-audit.txt

      - name: Confirma que o pacote não trouxe dependência de runtime
        # A alegação central do ADR-0001, checada por máquina em vez de confiada ao
        # comentário. Um PR que adiciona dependência de runtime falha aqui.
        run: |
          python - <<'PY'
          import pathlib, sys, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = data["project"].get("dependencies", [])
          if deps:
              sys.exit(f"ADR-0001 violado: dependencia de runtime declarada: {deps}")
          print("zero dependencia de runtime, como o ADR-0001 exige")
          PY
