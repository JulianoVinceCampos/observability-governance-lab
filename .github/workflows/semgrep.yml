name: semgrep

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instala semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: SAST com SARIF
        # Rulesets escolhidos pelo que este repo de fato é. Incluir p/nginx ou p/kotlin num
        # projeto Python só produz ruído, e ruído ensina o time a ignorar o gate.
        # `|| true` aqui é para o SARIF sempre subir; o veredito bloqueante é o step
        # seguinte, que falha em ERROR.
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/ci \
            --config p/python \
            --config p/dockerfile \
            --sarif --output semgrep.sarif || true

      - name: Sobe o SARIF para o Security tab
        uses: github/codeql-action/upload-sarif@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Reprova em severidade ERROR
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/ci \
            --config p/python \
            --config p/dockerfile \
            --severity ERROR --error --quiet
