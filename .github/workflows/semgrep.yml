name: semgrep

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Instala semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: SAST com SARIF
        # Rulesets escolhidos pelo que este repo de fato é. Incluir p/nginx ou p/kotlin num
        # projeto Python só produz ruído, e ruído ensina o time a ignorar o gate.
        # `|| true` aqui é para o SARIF sempre subir; o veredito bloqueante é o step
        # seguinte, que falha em ERROR.
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/ci \
            --config p/python \
            --config p/dockerfile \
            --sarif --output semgrep.sarif || true

      - name: Sobe o SARIF para o Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Reprova em severidade ERROR
        run: |
          semgrep scan \
            --config p/default \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config p/ci \
            --config p/python \
            --config p/dockerfile \
            --severity ERROR --error --quiet
