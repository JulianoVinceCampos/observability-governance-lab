name: sonar

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        # Não obrigatório de propósito. O projeto no SonarCloud é criado à mão, então o
        # secret existe depois do repo. Marcar como required faria o pipeline reprovar por
        # configuração pendente, e um gate que reprova por motivo errado ensina o time a
        # ignorar o resultado.
        required: false

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica se o SonarCloud está configurado
        id: guard
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN ausente. Crie o projeto no SonarCloud e adicione o secret para ligar o quality gate."
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.guard.outputs.configurado == 'true'
        with:
          # O Sonar precisa do histórico para atribuir código novo ao autor e à data.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.guard.outputs.configurado == 'true'
        with:
          python-version: "3.12"

      - name: Instala
        if: steps.guard.outputs.configurado == 'true'
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Cobertura para o Sonar consumir
        if: steps.guard.outputs.configurado == 'true'
        run: python -m pytest --cov --cov-report=xml

      - name: Scan e espera pelo quality gate
        # O sonar-project.properties tem qualitygate.wait=true. Sem isso o step fica verde
        # antes de o Sonar terminar, e o gate é decorativo.
        if: steps.guard.outputs.configurado == 'true'
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
