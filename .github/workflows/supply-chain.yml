name: supply-chain

on:
  workflow_call:

# Teto, não default: precisa cobrir o que o job pede.
permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom-and-provenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build do wheel e do sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: O wheel carrega o bundle web
        # O bundle não é código Python, então depende de `artifacts` no pyproject. Sem esta
        # checagem, um wheel sem dashboard passa e só quebra no deploy.
        run: |
          python -m pip install --upgrade wheel
          python - <<'PY'
          import pathlib, sys, zipfile
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("nenhum wheel em dist/")
          nomes = zipfile.ZipFile(wheels[0]).namelist()
          exigidos = ["obsgov/web/index.html", "obsgov/web/app.js", "obsgov/web/styles.css"]
          faltando = [e for e in exigidos if not any(n.endswith(e) for n in nomes)]
          if faltando:
              sys.exit(f"wheel sem o bundle web: {faltando}")
          print(f"wheel {wheels[0].name} carrega o bundle web completo")
          PY

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: observability-governance-lab-sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json

      - name: Atestação de proveniência do build
        # Faz `gh attestation verify` funcionar contra os artefatos publicados: qualquer
        # pessoa confirma qual commit e qual workflow os produziu.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-and-sbom
          path: |
            dist/*
            sbom.cyclonedx.json
          retention-days: 14
