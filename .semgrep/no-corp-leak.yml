# Segunda engine para a mesma intenção do tools/sanitize_scan.py. Duas implementações
# independentes da mesma regra: um bug em uma delas não desliga o gate em silêncio.
#
# Este é o único gate do repositório que protege algo irreversível. Um identificador
# vazado em histórico público não se despublica, então roda antes do lint e falha fechado.
rules:
  - id: no-aws-instance-id
    pattern-regex: '\bi-0[a-f0-9]{8,17}\b'
    message: "instance id real de AWS. Use i-0EXAMPLE."
    severity: ERROR
    languages: [generic]
    paths:
      exclude:
        - tools/sanitize_scan.py
        - .semgrep/
        - .gitleaks.toml

  - id: no-aws-account-id
    pattern-regex: '\b(?:arn:aws:[a-z0-9-]*:[a-z0-9-]*:)?\d{12}\b'
    message: "account id de 12 dígitos ou ARN com conta. Use 000000000000."
    severity: ERROR
    languages: [generic]
    paths:
      exclude:
        - tools/sanitize_scan.py
        - .semgrep/
        - .gitleaks.toml

  - id: no-corp-domain
    pattern-regex: '(?i)\b[a-z0-9.-]+\.(?:crdc\.(?:com\.br|me|tools)|globalhitss\.com\.br)\b'
    message: "domínio corporativo. Use example.com."
    severity: ERROR
    languages: [generic]
    paths:
      exclude:
        - tools/sanitize_scan.py
        - .semgrep/
        - .gitleaks.toml

  - id: no-brazilian-tax-id
    pattern-regex: '\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b|\b\d{3}\.\d{3}\.\d{3}-\d{2}\b'
    message: "número no formato de CNPJ ou CPF. Gere um sintético."
    severity: ERROR
    languages: [generic]
    paths:
      exclude:
        - tools/sanitize_scan.py
        - .semgrep/
        - .gitleaks.toml

  - id: no-private-ip
    pattern-regex: '\b(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}\b'
    message: "IP privado real. Use as faixas de documentação do RFC 5737."
    severity: ERROR
    languages: [generic]
    paths:
      exclude:
        - tools/sanitize_scan.py
        - .semgrep/
        - .gitleaks.toml

  - id: no-internal-hostname
    pattern-regex: '(?i)\b(?:wildfly-[0-9]|db2_[ac]|formaliza[a-z]*o|escritura[a-z]*o|agronegocio)\b'
    message: "nome de host ou produto interno. Descreva o padrão de arquitetura."
    severity: ERROR
    languages: [generic]
    paths:
      exclude:
        - tools/sanitize_scan.py
        - .semgrep/
        - .gitleaks.toml
