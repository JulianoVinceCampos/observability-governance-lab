sonar.projectKey=JulianoVinceCampos_observability-governance-lab
sonar.organization=julianovincecampos
sonar.projectName=observability-governance-lab

sonar.sources=src,tools
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml

# O bundle web é servido como arquivo estático, não passa por build. Fica na análise
# porque app.js tem lógica de verdade e merece ser olhado.
sonar.exclusions=**/__pycache__/**,out/**

# New code é medido contra main. O repo é greenfield, então o quality gate vale em new e
# em overall: não há dívida legada para carimbar como aceitável.
sonar.newCode.referenceBranch=main

# Sem isto o step do scan fica verde antes de o Sonar terminar, e o "gate" é decorativo.
# É a forma mais comum de configurar essa integração errado.
sonar.qualitygate.wait=true
